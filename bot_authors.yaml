# Bot authors whose review threads can be auto-resolved.
# Exact matches checked first, then regex patterns.
bot_authors:
  - "github-actions[bot]"
  - "gitleaks[bot]"
  - "copilot-pull-request-reviewer"
  - "gemini-code-assist"
  # The Codex GitHub reviewer app posts review threads as this login (no [bot]
  # suffix, not ^gemini-/^copilot-). Without it, unresolved Codex threads are
  # dropped before the remaining-threads count and the gate can return
  # MERGE_READY with an open Codex P1 thread still unresolved (fail-open).
  - "chatgpt-codex-connector"

# Regex patterns applied if no exact match.
# Matched against the full author login string.
bot_patterns:
  - "\\[bot\\]$"
  - "^copilot-"
  - "^gemini-"
  - "^chatgpt-codex"
