[project]
name = "failclosed"
version = "0.2.0"
description = "Fail-closed merge admission control for agent-written code: run an LLM reviewer, distrust its verdict, refuse MERGE_READY on unparseable or self-contradictory output."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dan Mercede" }]
keywords = ["code-review", "llm", "ci", "merge-gate", "fail-closed", "agents", "governance"]

[project.urls]
Homepage = "https://danmercede.com"

[project.optional-dependencies]
dev = ["ruff", "pytest"]

# Runs from a clone (`python run_review_pipeline.py ...`). Packaging into
# an installable distribution (a proper package layout with relative imports)
# is a tracked follow-up; it is deliberately not promised here.

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Imports here intentionally follow module-level path setup (SCRIPT_DIR), so
# E402 (import-not-at-top) is expected and correct, not a defect.
"run_review_pipeline.py" = ["E402"]
"test_resolve_bot_threads.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "-q"
